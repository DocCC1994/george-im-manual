# Order of the books. Each topic id matches a folder in topics/<system>/<id>/.
# A topic without a folder yet is "planned": it appears in the editor report's progress table only.
# Topic list = the 47 topics in the project plan, plus infective endocarditis and valvular heart disease (added Oct 2026).

hospital: George Hospital
department: Department of Internal Medicine
edition: "2026"
version: "1"
editor_email: editor@example.com     # CHECK: replace with the real editorial mailbox

books:
  acute:     {name: Acute Handbook,   runhead: "GEORGE HOSPITAL: ACUTE HANDBOOK"}
  reference: {name: Reference Manual, runhead: "GEORGE HOSPITAL: REFERENCE MANUAL"}

systems:
  - id: cardiology
    name: Cardiology
    topics:
      - stemi
      - nste-acs
      - heart-failure
      - {id: arrhythmias, title: "Arrhythmias: AF, SVT, VT, bradycardia and heart block", start: New, priority: P1}
      - hypertensive-emergency
      - {id: pulmonary-embolism, title: Pulmonary embolism, start: New, priority: P1}
      - {id: infective-endocarditis, title: Infective endocarditis, start: New (added), priority: P1}
      - {id: valvular-heart-disease, title: Valvular heart disease (including rheumatic heart disease), start: New (added), priority: P1}
  - id: respiratory
    name: Respiratory
    topics:
      - {id: asthma-acute, title: Acute asthma, start: Rewrite (2016), priority: P1}
      - {id: copd-acute, title: Acute COPD exacerbation, start: Rewrite (2016), priority: P1}
      - {id: cap, title: Community-acquired pneumonia, start: Rewrite (2024), priority: P1}
      - {id: haemoptysis, title: Haemoptysis, start: New, priority: P2}
  - id: infection
    name: Infection
    topics:
      - {id: sepsis, title: Sepsis and septic shock, start: New (pilot), priority: P1}
      - {id: meningitis, title: "Meningitis: bacterial, TB, cryptococcal", start: Rewrite + new (crypto 2021), priority: P1}
      - {id: malaria, title: Severe malaria, start: Rewrite (2019), priority: P1}
      - {id: neutropenic-sepsis, title: Neutropenic sepsis, start: New, priority: P2}
      - {id: tb-ec, title: Suspected TB in the EC, start: Rewrite (TB SOPs), priority: P2}
  - id: endocrine
    name: Endocrine and metabolic
    topics:
      - {id: dka-hhs, title: DKA and HHS, start: Rewrite (pilot; 2024 draft), priority: P1}
      - {id: hypoglycaemia, title: Hypoglycaemia, start: New, priority: P1}
      - {id: hyponatraemia, title: Hyponatraemia, start: Rewrite (2016), priority: P1}
      - {id: hyperkalaemia, title: Hyperkalaemia, start: New, priority: P1}
      - {id: adrenal-crisis, title: Adrenal crisis, start: New, priority: P2}
      - {id: thyroid-emergencies, title: Thyroid storm and myxoedema coma, start: New, priority: P2}
  - id: renal
    name: Renal
    topics:
      - {id: aki, title: AKI and indications for urgent dialysis, start: New, priority: P1}
  - id: gi
    name: GI and liver
    topics:
      - {id: ugib, title: Upper GI bleeding, start: New, priority: P1}
      - {id: cirrhosis, title: "Decompensated cirrhosis: encephalopathy, SBP", start: New, priority: P1}
      - {id: acute-liver-failure, title: Acute liver failure, start: New, priority: P2}
  - id: neurology
    name: Neurology
    topics:
      - {id: stroke, title: Acute stroke and thrombolysis, start: Merge (2020 + 2012), priority: P1}
      - {id: status-epilepticus, title: Status epilepticus, start: Rewrite (2022), priority: P1}
      - {id: first-seizure, title: First seizure, start: Rewrite (2022), priority: P2}
      - {id: delirium-withdrawal, title: Delirium and alcohol withdrawal, start: New, priority: P1}
  - id: haematology
    name: Haematology and oncology
    topics:
      - {id: anticoagulant-bleeding, title: Bleeding on anticoagulants and reversal, start: New (from warfarin 2012), priority: P1}
      - {id: transfusion, title: Red cell transfusion, start: Rewrite (2015), priority: P2}
      - {id: tls, title: Tumour lysis syndrome, start: Rewrite (GSH 2018), priority: P2}
  - id: critical-care
    name: Allergy and critical care
    topics:
      - {id: anaphylaxis, title: Anaphylaxis and angio-oedema, start: New, priority: P1}
      - {id: icu-referral, title: "Intubation, ICU referral and ceiling-of-care decisions", start: New, priority: P1}
  - id: toxicology
    name: Toxicology
    topics:
      - {id: poisoning-general, title: General approach to poisoning, start: New, priority: P1}
      - {id: paracetamol, title: Paracetamol, start: Rewrite (pilot; 2021), priority: P1}
      - {id: tca, title: Tricyclic antidepressants, start: Rewrite (2021), priority: P1}
      - {id: carbamazepine, title: Carbamazepine, start: Rewrite (undated), priority: P2}
      - {id: ccb, title: Calcium channel blockers, start: Rewrite (2024 draft), priority: P1}
      - {id: beta-blockers, title: Beta-blockers, start: New, priority: P1}
      - {id: theophylline, title: Theophylline, start: Rewrite (2021), priority: P2}
      - {id: isoniazid, title: Isoniazid, start: Rewrite (2021), priority: P1}
      - {id: organophosphates, title: Organophosphates, start: Rewrite (2016), priority: P1}
      - {id: toxic-alcohols, title: Methanol and ethylene glycol, start: Rewrite (2021), priority: P2}
      - {id: salicylates, title: Salicylates, start: New, priority: P2}
      - {id: digoxin, title: Digoxin, start: New, priority: P2}
      - {id: other-poisons, title: "Iron, paraquat, paraffin, carbon monoxide, corrosives", start: New, priority: P2}
