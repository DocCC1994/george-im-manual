# Infusion recipes: the only place infusion concentrations and mL/hr rates live (CLAUDE.md "Build rules").
# A topic file inserts one with {{recipe:<id>}}; build.py calculates every mL/hr from amount, volume, dose and
# weight. Never type a rate here or in a topic file. Fill only from merged sheets; `from` names the sheet.
#
# Fields
#   match       words that name the drug; `build.py --check` flags a topic line naming one with a rate
#               (mL/hr, mL/h, mcg/kg/min) outside the macro
#   unit        unit of `amount` (mg, units, mmol); doses in mcg are converted from mg
#   amount, volume (mL), note (printed after the amount), ampoule (strength per 1 mL ampoule: prints the number of
#               ampoules), diluent, approx (prints "about" before the concentration), check (prints a CHECK marker)
#   variants    other bag strengths: list of {label, amount}; printed with their own concentration and formula
#   preps       several bags or syringes: list of {amount, volume}; rendered as table columns
#   dose_unit   units/kg/hr, mcg/kg/min, mg/min, mcg/min ...; doses: list; weights: list of kg (per-kg doses)
#   start, titrate   optional text line; formula: true adds "mL/hr = dose × kg × factor"
#   max_rate, pump   maximum rate in `unit`/hr (potassium); renders the maximum mL/hr for each prep
#   over        minutes for a single dose given over a set time (magnesium); renders the bag and its mL/hr
#   layout      inline (text inside the author's paragraph) or table

atropine:
  match: [atropine]
  from: organophosphates acute (STG 2024 §19.18.2 infusion table, 1 mg/mL ampoules)
  unit: mg
  ampoule: 1                      # 1 mg/mL ampoule
  amount: 40
  volume: 200
  diluent: sodium chloride 0.9%
  dose_unit: mg/hr
  doses: [2, 4, 6, 8, 12]
  check: "George atropine ampoule strength (1 mg/mL or 0.5 mg/mL; 100 mg/10 mL stocked?) and diluent"
  layout: inline

insulin:
  match: [insulin]
  from: dka-hhs acute (STG 2025; GRH 2024 syringe driver)
  unit: units
  preps:
    - {amount: 50, volume: 50}
    - {amount: 50, volume: 200}
  dose_unit: units/kg/hr
  doses: [0.1]
  weights: [50, 60, 70, 80, 90, 100]
  layout: table

adrenaline:
  match: [adrenaline, epinephrine]
  from: George standard bag (Craig, 21 Oct 2026); used on sepsis acute
  unit: mg
  ampoule: 1                      # 1 mg/mL ampoule
  amount: 12
  volume: 200
  dose_unit: mcg/kg/min
  start: 0.05
  titrate: "titrate to MAP ≥ 65 every 10–30 min; ceiling usually 0.5 mcg/kg/min, up to 1 in some cases"
  formula: true
  doses: [0.05, 0.1, 0.25]
  weights: [70]
  variants:
    - {label: Low-dose, amount: 6}
    - {label: Fluid-restricted, amount: 24}
  layout: inline

adrenaline-brady:
  match: [adrenaline, epinephrine]
  from: George standard bag (Craig, 21 Oct 2026); arrhythmias acute, bradycardia (PR #2)
  unit: mg
  ampoule: 1
  amount: 12
  volume: 200
  dose_unit: mcg/min
  doses: [2, 10]
  layout: inline

labetalol:
  match: [labetalol]
  from: hypertensive-emergency acute (STG 2024)
  unit: mg
  amount: 200
  volume: 200
  dose_unit: mg/min
  doses: [2]
  layout: inline

gtn:
  match: [GTN, glyceryl trinitrate, nitroglycerin]
  from: hypertensive-emergency acute (STG Table 3.3)
  unit: mg
  amount: 25
  volume: 250
  approx: true
  dose_unit: mcg/min
  doses: [5, 20, 100]
  layout: inline

potassium:
  match: [potassium, KCl]
  from: dka-hhs acute (GRH 2024 limit; KCl 1 ampoule = 20 mmol = 10 mL); IVAC and 20 mmol/hr maximum per Craig, 21 Oct 2026
  unit: mmol
  note: "KCl (1 ampoule = 20 mmol = 10 mL)"
  preps:
    - {amount: 20, volume: 1000}
    - {amount: 40, volume: 1000}
  max_rate: 20
  pump: IVAC
  layout: inline

magnesium:
  match: [magnesium]
  from: asthma-acute (STG 2024 §16.1; George chart per Craig, 21 Oct 2026)
  unit: g
  note: "(4 mL of 50%)"
  amount: 2
  volume: 100
  diluent: sodium chloride 0.9%
  over: 20
  pump: IVAC
  layout: inline

azithromycin:
  match: [azithromycin]
  from: "cap acute (STG 2024 §16.6, slow IV over at least 60 min; dilution from the package insert, to verify)"
  unit: mg
  note: "(1 vial, reconstituted with 4.8 mL water for injection)"
  amount: 500
  volume: 250
  diluent: sodium chloride 0.9%
  over: 60
  pump: IVAC
  layout: inline

insulin-hiet:
  match: [insulin]
  from: "ccb acute (GRH CCB protocol 2024 draft, Rev 5: 4000 units in 200 mL dextrose 5% via IVAC, 0.5 up to 10 units/kg/hr; local facts M14)"
  unit: units
  note: "Actrapid (40 mL of 100 units/mL)"
  amount: 4000
  volume: 200
  diluent: dextrose 5%
  check: "bag strength (GRH 2021 used 2000 units in 200 mL)"
  dose_unit: units/kg/hr
  start: 0.5
  titrate: "increase by 50% every 20 min until MAP ≥ 65 and HR ≥ 60, up to 10 units/kg/hr"
  formula: true
  doses: [0.5, 1, 5, 10]
  weights: [70]
  layout: inline

desferrioxamine:
  match: [desferrioxamine, deferoxamine]
  from: "iron acute (STG 2024 §19.7: 15 mg/kg/hr to 80 mg/kg; vial reconstitution from the Desferal PI; bag strength not from a source)"
  unit: mg
  note: "(10 vials of 500 mg, each reconstituted with 5 mL water for injection)"
  amount: 5000
  volume: 500
  diluent: sodium chloride 0.9%
  check: "bag strength: no George or STG recipe"
  dose_unit: mg/kg/hr
  formula: true
  doses: [15]
  weights: [50, 70, 90]

nac-1:
  match: [acetylcysteine, NAC]
  from: "paracetamol acute (STG 2024 §19.5.1 two-bag regimen; George EC NAC sheet; ampoule 200 mg/mL to verify)"
  unit: mg/kg
  note: "(1 mL/kg of acetylcysteine 200 mg/mL)"
  amount: 200
  volume: 500
  diluent: dextrose 5%
  over: 240
  pump: IVAC
  layout: inline

nac-2:
  match: [acetylcysteine, NAC]
  from: "paracetamol acute (STG 2024 §19.5.1 two-bag regimen; George EC NAC sheet)"
  unit: mg/kg
  note: "(0.5 mL/kg of acetylcysteine 200 mg/mL)"
  amount: 100
  volume: 1000
  diluent: dextrose 5%
  over: 960
  pump: IVAC
  layout: inline

bicarbonate-salicylate:
  match: [bicarbonate]
  from: "salicylates acute (STG 2024 §19.5.2: maintenance 150-200 mL/hr)"
  unit: mmol
  note: "(150 mL of sodium bicarbonate 8.4%, added to dextrose 5% 1 L after removing 150 mL)"
  amount: 150
  volume: 1000
  dose_unit: mmol/hr
  doses: [22.5, 30]
  layout: inline

bicarbonate-tca:
  match: [bicarbonate]
  from: "tca acute (GRH TCA protocol 2021: 150 mL 8.4% in dextrose 5% 1 L at 250 mL/hr)"
  unit: mmol
  note: "(150 mL of sodium bicarbonate 8.4%, added to dextrose 5% 1 L after removing 150 mL)"
  amount: 150
  volume: 1000
  dose_unit: mmol/hr
  doses: [37.5]

iron-dextran:
  match: [iron dextran, CosmoFer]
  from: "severe-anaemia acute (STG 2024 §2.1.1: 100–200 mg in 100 mL, maximum 100 mL over 30 min)"
  unit: mg
  note: "(or 100 mg)"
  amount: 200
  volume: 100
  diluent: sodium chloride 0.9% or dextrose 5%
  over: 30
  layout: inline

iron-dextran-tdi:
  match: [iron dextran, CosmoFer]
  from: "severe-anaemia acute (STG 2024 §2.1.1: total dose infusion up to 20 mg/kg in 500 mL over 4–6 hours; 4 hours is the fastest)"
  unit: mg/kg
  note: "(at most; the calculated total dose)"
  amount: 20
  volume: 500
  diluent: sodium chloride 0.9% or dextrose 5%
  over: 240
  layout: inline

calcium-gluconate-bolus:
  match: [calcium gluconate]
  from: "calcium-emergencies acute (STG 2024 §8.10: 20 mL of 10% in 100 mL dextrose 5% over 20 min, with ECG monitoring)"
  unit: mL
  note: "of calcium gluconate 10%"
  amount: 20
  volume: 100
  diluent: dextrose 5%
  over: 20
  pump: IVAC
  layout: inline

calcium-gluconate-maint:
  match: [calcium gluconate]
  from: "calcium-emergencies acute (STG 2024 §8.10: 15 mg/kg (= 1.7 mL/kg of 10%) in 1 000 mL sodium chloride 0.9% over 4 hours)"
  unit: mg/kg
  note: "(1.7 mL/kg of calcium gluconate 10%)"
  amount: 15
  volume: 1000
  diluent: sodium chloride 0.9%
  over: 240
  pump: IVAC
  layout: inline

octreotide:
  match: [octreotide]
  from: "ugib acute (Baveno VII dose 50 mcg/hr, not in the STG; bag strength not from a source)"
  unit: mg
  amount: 0.5
  volume: 50
  diluent: sodium chloride 0.9%
  check: "octreotide stocked at George (M9) and bag strength: no George or STG recipe"
  dose_unit: mcg/hr
  doses: [50]
  layout: inline
